# Local test of the Railway template (not used by Railway).
#   ADMIN_EMAIL=you@example.com ADMIN_PASSWORD=$(openssl rand -hex 16) \
#   INSTATIC_SECRET_KEY=$(openssl rand -base64 32) docker compose -f compose.test.yml up --build
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: railway
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localtestonly
    volumes: [pg:/var/lib/postgresql]
  instatic:
    build: .
    depends_on: [postgres]
    ports: ["8080:8080"]
    environment:
      PORT: "8080"
      DATABASE_URL: postgresql://postgres:localtestonly@postgres:5432/railway
      INSTATIC_SECRET_KEY: ${INSTATIC_SECRET_KEY}
      PUBLIC_ORIGIN: http://localhost:8080
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes: [storage:/app/storage]
    mem_limit: 512m
    cpus: 1
volumes:
  pg:
  storage:
